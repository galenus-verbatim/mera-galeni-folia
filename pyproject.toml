[project]
name = "mera-galeni-folia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "frozen-flask>=1.0.2",
    "kodon-py",
    "lxml>=6.0.0",
    "lxml-stubs>=0.5.1",
    "markdown>=3.10.2",
    "pyzotero>=1.6.11",
    "stanza>=1.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.3",
    "tqdm>=4.67.1",
]

[tool.uv.sources]
kodon-py = { git = "https://github.com/PerseusDLCode/kodon-py.git" }

[project.scripts]
galenus = "mera_galeni_folia.build:main"
galenus-dev = "mera_galeni_folia.app:main"
galenus-index = "mera_galeni_folia.build_search_index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mera_galeni_folia"]
