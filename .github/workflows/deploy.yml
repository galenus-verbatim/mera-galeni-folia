name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Checkout galenus_cts
        id: checkout-galenus-cts
        uses: actions/checkout@v6
        with:
          repository: "galenus-verbatim/galenus_cts"
          path: "./galenus_cts"

      - name: Cache parsed TEI
        id: cache-tei
        uses: actions/cache@v5
        with:
          path: tei_json
          key: ${{ steps.checkout-galenus-cts.outputs.ref }}

      - name: Parse TEI data
        if: steps.cache-tei.outputs.cache-hit != 'true'
        run: uv run kodon ingest parse ./galenus_cts/data

      - name: Cache Stanza models
        uses: actions/cache@v5
        with:
          path: ~/stanza_resources
          key: stanza-grc-la

      - name: Cache search index
        id: cache-search-index
        uses: actions/cache@v5
        with:
          path: |
            src/mera_galeni_folia/static/search-index.sqlite
            src/mera_galeni_folia/static/search-index.sqlite.gz
          key: search-index-${{ steps.checkout-galenus-cts.outputs.ref }}-${{ hashFiles('src/mera_galeni_folia/build_search_index.py') }}

      - name: Build search index
        if: steps.cache-search-index.outputs.cache-hit != 'true'
        run: uv run galenus-index

      - name: Publish search index as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view search-index --repo "$GITHUB_REPOSITORY" || \
            gh release create search-index --repo "$GITHUB_REPOSITORY" \
              --title "Search index" \
              --notes "Auto-published by deploy.yml; overwritten on every deploy. Too large to serve from GitHub Pages."
          gh release upload search-index \
            src/mera_galeni_folia/static/search-index.sqlite.gz \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Build site
        run: uv run galenus
        env:
          FREEZER_BASE_URL: ${{ vars.FREEZER_BASE_URL }}

      - name: Remove search index from Pages artifact
        run: rm -f build/static/search-index.sqlite build/static/search-index.sqlite.gz

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
